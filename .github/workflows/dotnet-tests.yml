name: .NET tests

on:
  push:
    branches: [keelys-edits, dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and run xUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BlackjackApp.Tests/BlackjackApp.Tests.csproj
      - name: Test
        run: dotnet test BlackjackApp.Tests/BlackjackApp.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=GameServiceTests.trx" --results-directory TestResults
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-trx-report
          path: TestResults/*.trx
          if-no-files-found: warn
